name: BTC Fibonacci Elliott public data 20261030
on:
  push:
    branches: ['research/btc-fibonacci-elliott-20261030']
    paths: ['.github/workflows/btc-fib-elliott-public-20261030.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect public data
        run: |
          mkdir -p fib_public_data
          python - <<'PY'
          import pathlib,urllib.request,json,datetime,hashlib,concurrent.futures
          out=pathlib.Path('fib_public_data')
          urls={f'latest_{tf}.json':f'https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval={tf}&limit=1000' for tf in ['30m','1h','4h','8h','1d']}
          urls.update({'time.json':'https://data-api.binance.vision/api/v3/time','ticker.json':'https://data-api.binance.vision/api/v3/ticker/price?symbol=BTCUSDT','bitstamp_ticker.json':'https://www.bitstamp.net/api/v2/ticker/btcusd/','coinbase_ticker.json':'https://api.exchange.coinbase.com/products/BTC-USD/ticker'})
          def get(item):
              name,url=item;rec={'name':name,'url':url,'retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'BTC-public-research/1.0'})
                  with urllib.request.urlopen(req,timeout=30) as r: b=r.read();rec['status']=r.status
                  (out/name).write_bytes(b);rec.update(bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
              except Exception as e:rec['error']=str(e)
              return rec
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex: records=list(ex.map(get,urls.items()))
          (out/'SOURCE_MANIFEST.json').write_text(json.dumps(records,indent=2))
          print(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-fib-elliott-public-20261030
          path: fib_public_data/
          retention-days: 30

name: BTC Candlestick Master Phase 3D

on:
  push:
    branches:
      - research/candlestick-master
    paths:
      - ".github/workflows/candlestick_master_phase3d.yml"
      - "research/candlestick_master/phase3d_parts/**"
      - "research/candlestick_master/requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cross-venue-research:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/candlestick-master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r research/candlestick_master/requirements.txt

      - name: Restore Phase 3D engine
        run: cat research/candlestick_master/phase3d_parts/part_*.py > research/candlestick_master/candle_master_phase3d.py

      - name: Syntax check
        run: python -m py_compile research/candlestick_master/candle_master_phase3d.py

      - name: Run cross-venue, cost and session research
        run: python research/candlestick_master/candle_master_phase3d.py

      - name: Upload Phase 3D artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-candlestick-master-phase3d
          path: research/candlestick_master/output_phase3d/
          if-no-files-found: error
          retention-days: 30

      - name: Commit reproducible Phase 3D results
        run: |
          git config user.name "candlestick-research-bot"
          git config user.email "candlestick-research-bot@users.noreply.github.com"
          git pull --rebase origin research/candlestick-master
          git add research/candlestick_master/output_phase3d/
          if git diff --cached --quiet; then
            echo "No Phase 3D result changes"
          else
            git commit -m "research: update Phase 3D cross-venue results [skip ci]"
            git push origin HEAD:research/candlestick-master
          fi

name: Polaris Daily Snapshot October 30 2026
on:
  push:
    branches: [research/polaris-v16-alt-20261030]
    paths: [.github/workflows/polaris_snapshot_20261030.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query timestamped public daily candles and ticker
        run: |
          python - <<'PY'
          import json,datetime,urllib.request,urllib.error,time
          print('REQUEST_UTC',datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          sources={
          'binance_klines':'https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=5',
          'binance_data_klines':'https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=5',
          'binance_api1_klines':'https://api1.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=5',
          'binance_price':'https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT',
          'binance_24h':'https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT',
          'coinbase_candles':'https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=86400',
          'coinbase_spot':'https://api.coinbase.com/v2/prices/BTC-USD/spot',
          'kraken_ohlc':'https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=1440',
          'kraken_ticker':'https://api.kraken.com/0/public/Ticker?pair=XBTUSD'
          }
          for key,url in sources.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Polaris-readonly-20261030','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=9) as r:
                payload=json.loads(r.read().decode('utf-8'))
              if key.endswith('klines') and isinstance(payload,list): payload=payload[-5:]
              if key=='coinbase_candles' and isinstance(payload,list): payload=sorted(payload,key=lambda x:x[0])[-5:]
              if key=='kraken_ohlc' and isinstance(payload,dict) and 'result' in payload:
                payload={k:(v[-5:] if isinstance(v,list) else v) for k,v in payload['result'].items()}
              print('RESULT',key,datetime.datetime.now(datetime.timezone.utc).isoformat(),json.dumps(payload,ensure_ascii=False)[:5000],flush=True)
            except Exception as exc:
              print('FAIL',key,repr(exc),flush=True)
          PY

name: BTC crash precursor public data 20261030
on:
  push:
    branches: ['research/btc-crash-precursors-20261030']
    paths: ['.github/workflows/btc-crash-public-data-20261030.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Collect public historical and latest candles
        run: |
          mkdir -p crash_public_data
          python - <<'PY'
          import urllib.request, urllib.parse, json, pathlib, datetime, hashlib, concurrent.futures
          out=pathlib.Path('crash_public_data')
          urls={}
          epoch=lambda d:int(datetime.datetime.fromisoformat(d).replace(tzinfo=datetime.timezone.utc).timestamp())
          for start in ['2011-08-18','2014-01-01','2016-01-01','2018-01-01']:
              q=urllib.parse.urlencode({'step':86400,'limit':1000,'start':epoch(start)})
              urls['bitstamp_'+start+'.json']='https://www.bitstamp.net/api/v2/ohlc/btcusd/?'+q
          urls['binance_latest_1d.json']='https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=40'
          urls['binance_latest_4h.json']='https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=4h&limit=120'
          urls['binance_ticker.json']='https://data-api.binance.vision/api/v3/ticker/price?symbol=BTCUSDT'
          urls['binance_time.json']='https://data-api.binance.vision/api/v3/time'
          urls['coinmetrics_btc.csv']='https://raw.githubusercontent.com/coinmetrics/data/master/csv/btc.csv'
          def fetch(item):
              name,url=item; rec={'name':name,'url':url,'retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'BTCResearch/1.0 public historical data audit'})
                  with urllib.request.urlopen(req,timeout=60) as r:
                      b=r.read(); rec.update(status=r.status,bytes=len(b),headers=dict(r.headers))
                  (out/name).write_bytes(b); rec['sha256']=hashlib.sha256(b).hexdigest()
                  if name.startswith('bitstamp'):
                      a=json.loads(b).get('data',{}).get('ohlc',[])
                      rec['rows']=len(a)
                      if a: rec['first_timestamp']=a[0]['timestamp'];rec['last_timestamp']=a[-1]['timestamp']
                  elif name.startswith('binance_latest'):
                      a=json.loads(b);rec['rows']=len(a)
                      if isinstance(a,list) and a:rec['first_open']=a[0][0];rec['last_open']=a[-1][0]
              except Exception as e:rec['error']=str(e)
              print(json.dumps({k:v for k,v in rec.items() if k!='headers'}),flush=True)
              return rec
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex: audit=list(ex.map(fetch,urls.items()))
          (out/'SOURCE_MANIFEST.json').write_text(json.dumps(audit,indent=2))
          PY
      - name: Preserve raw responses and source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-crash-public-data-20261030
          path: crash_public_data/
          retention-days: 30

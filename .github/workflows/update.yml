name: 폴라리스 업비트KRW x 크립토닷컴 전수 자동갱신

on:
  workflow_dispatch:
  schedule:
    - cron: "25 0 * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 프로그램 설치
        run: pip install -r requirements.txt

      - name: 업비트 KRW x Crypto.com 전수 스캔
        run: python scan_all.py

      - name: 결과 자동 저장
        run: |
          git config user.name "polaris-ma-bot"
          git config user.email "polaris-ma-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "자동 갱신: 폴라리스 이평선 전수 스캔"
            git push
          fi

name: BTC multiframe public data 20261030
on:
  push:
    branches: ['research/btc-multiframe-20261030']
    paths: ['.github/workflows/btc-multiframe-public-20261030.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect official public data with checksums
        run: |
          mkdir -p public_data/archive public_data/api
          python - <<'PY'
          import urllib.request, urllib.parse, pathlib, json, hashlib, datetime, time, concurrent.futures
          out=pathlib.Path('public_data'); audit=[]
          def get(url):
              for trial in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'BTC-multiframe-research/1.0'})
                      with urllib.request.urlopen(req,timeout=45) as r:return r.read()
                  except Exception:
                      if trial==2:raise
                      time.sleep(1+trial)
          tasks=[]
          for y in range(2018,2027):
              for m in range(1,13):
                  if (y,m)>(2026,9):continue
                  tasks.append(('30m',f'{y}-{m:02d}'))
          for tf in ['1h','8h']:
              for month in ['2019-01','2022-11','2026-09']:tasks.append((tf,month))
          def archive(item):
              tf,month=item;name=f'BTCUSDT-{tf}-{month}.zip'
              url=f'https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/{tf}/{name}'
              rec={'name':name,'url':url,'retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  b=get(url); ch=get(url+'.CHECKSUM'); observed=hashlib.sha256(b).hexdigest();expected=ch.decode().split()[0]
                  if observed!=expected:raise RuntimeError('CHECKSUM mismatch')
                  (out/'archive'/name).write_bytes(b);(out/'archive'/(name+'.CHECKSUM')).write_bytes(ch)
                  rec.update(bytes=len(b),sha256=observed,checksum_match=True)
              except Exception as e:rec['error']=str(e)
              return rec
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              for i,rec in enumerate(pool.map(archive,tasks)):
                  audit.append(rec)
                  if rec.get('error') or i%20==0:print(i,json.dumps(rec),flush=True)
          def api(name,url):
              rec={'name':name,'url':url,'retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  b=get(url);(out/'api'/name).write_bytes(b);obj=json.loads(b)
                  rec.update(bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
                  if isinstance(obj,list):rec['rows']=len(obj)
                  audit.append(rec);return obj
              except Exception as e:rec['error']=str(e);audit.append(rec);return None
          base='https://data-api.binance.vision/api/v3/'
          start=int(datetime.datetime(2026,10,1,tzinfo=datetime.timezone.utc).timestamp()*1000)
          for i in range(4):
              a=api(f'30m_october_page{i}.json',base+f'klines?symbol=BTCUSDT&interval=30m&limit=1000&startTime={start}')
              if not isinstance(a,list) or not a:break
              start=int(a[-1][0])+1800000
              if len(a)<1000:break
          for tf in ['30m','1h','4h','8h','1d']:
              api(f'latest_{tf}.json',base+f'klines?symbol=BTCUSDT&interval={tf}&limit=1000')
          api('ticker.json',base+'ticker/price?symbol=BTCUSDT')
          api('time.json',base+'time')
          (out/'SOURCE_MANIFEST.json').write_text(json.dumps(audit,indent=2))
          print('SUMMARY',json.dumps({'files':len(audit),'errors':[x for x in audit if x.get('error')],'ended_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}),flush=True)
          PY
      - name: Store raw public data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-multiframe-public-data-20261030
          path: public_data/
          retention-days: 30

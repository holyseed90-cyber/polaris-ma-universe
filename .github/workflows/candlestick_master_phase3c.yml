name: BTC Candlestick Master Phase 3C

on:
  push:
    branches:
      - research/candlestick-master
    paths:
      - ".github/workflows/candlestick_master_phase3c.yml"
      - "research/candlestick_master/phase3c_parts/**"
      - "research/candlestick_master/phase3b_parts/**"
      - "research/candlestick_master/requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  precision-research:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/candlestick-master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r research/candlestick_master/requirements.txt

      - name: Restore Phase 3B dependency
        run: cat research/candlestick_master/phase3b_parts/part_*.py > research/candlestick_master/candle_master_phase3b.py

      - name: Restore Phase 3C engine
        run: cat research/candlestick_master/phase3c_parts/part_*.py > research/candlestick_master/candle_master_phase3c.py

      - name: Syntax check
        run: |
          python -m py_compile research/candlestick_master/candle_master_phase3b.py
          python -m py_compile research/candlestick_master/candle_master_phase3c.py

      - name: Run precision research
        run: python research/candlestick_master/candle_master_phase3c.py

      - name: Upload Phase 3C artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-candlestick-master-phase3c
          path: research/candlestick_master/output_phase3c/
          if-no-files-found: error
          retention-days: 30

      - name: Commit reproducible Phase 3C results
        run: |
          git config user.name "candlestick-research-bot"
          git config user.email "candlestick-research-bot@users.noreply.github.com"
          git pull --rebase origin research/candlestick-master
          git add research/candlestick_master/output_phase3c/
          if git diff --cached --quiet; then
            echo "No Phase 3C result changes"
          else
            git commit -m "research: update candlestick Phase 3C results [skip ci]"
            git push origin HEAD:research/candlestick-master
          fi
